<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar md:navbar-expand bg-1">
            <div class="container-fluid">
              <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
              </button>
              <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
                <div class="drawer-header">
                  <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body mb-2 md:mb-0">
                  <ul class="nav navbar-nav me-auto">
                    <li class="nav-item">
                      <a class="nav-link active" aria-current="page" href="#">Usuarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="pages/cuentas.html">Cuentas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="pages/movimientos.html">Movimientos</a>
                    </li>
                  </ul>
                </div>
              </dialog>
            </div>
          </nav>
    </header>
    <main class="container py-5">
        <section class="text-center mb-5">
            <h1 class="fw-bold">Sistema de Control de Gastos Personales</h1>
            <h3 class="fw-semibold"></h3>
        </section>
        <section class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white text-center fw-bold">
                <h2 class="h3 mb-0">Registrar</h2>
            </div>
            <div class="card-body my-4">
                <form id="frmAddEntidad"></form>
                <input type="hidden" id="idEntidad">
            </div>
            <div class="form-group my-4">
                <label for="txtId" class="form-label">Usuario</label>
                <select class="form-control" id="selectUsuarios">
                    <option class="fg-info">Elige un Usuario</option>
                </select>        
                </div>
            <div class="form-group my-3">
                <label for="txtUsuario" class="form-label">Usuario</label> 
                <input type="text" id="txtUsuario" class="form-control" required>
            </div>
            <div class="form-group my-3">
                <label for="txtCorreo" class="form-label">Correo</label> 
                <input type="email" id="txtCorreo" class="form-control" required>
            </div>
            <div class="form-group my-3">
                <label for="numTelefono" class="form-label">Telefono</label> 
                <input type="text" id="txtUsuario" class="form-control" required>
            </div>
            <div class="form-group my-3">
                <button id="btnRegistrarCuenta" class="btn btn-success" type="submit">Registrar</button>
                <button id="btnCancelar" class="btn btn-secondary d-none" type="button">Cancelar</button>
            </div>
        </section>
        <section class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h2 class="h5 mb-0">Lista de cuentas</h2>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Id</th>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Saldo Inicial</th>
                                <th>Saldo Actual</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="/js/controllers/indexController.js"></script>
</body>
</html>
